name: Deploy to Development (AKS)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_NAME: nestjs-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:all

      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR (no Docker needed on the runner)
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "$IMAGE_NAME:${{ github.sha }}" \
            --image "$IMAGE_NAME:dev" \
            --build-arg APP_VERSION="dev-${GITHUB_SHA::7}" \
            .

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Deploy (kustomize overlay dev)
        run: scripts/deploy.sh dev "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"

      - name: Smoke test
        run: scripts/smoke-test.sh dev
