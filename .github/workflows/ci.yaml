name: CI

on:
  pull_request:
  push:
    branches-ignore: [develop, main, openshift]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:all
      - name: Validate manifests render
        run: |
          for o in minikube dev prod; do kubectl kustomize k8s/overlays/$o > /dev/null && echo "overlay $o OK"; done
