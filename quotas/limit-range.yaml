# Once a ResourceQuota exists, every Pod MUST declare requests/limits or it is rejected.
# A LimitRange injects defaults so ad-hoc pods (kubectl run nginx ...) still schedule.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: dev
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 1Gi
      min:
        cpu: 50m
        memory: 64Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: prod
spec:
  limits:
    - type: Container
      default:
        cpu: 1000m
        memory: 512Mi
      defaultRequest:
        cpu: 200m
        memory: 256Mi
